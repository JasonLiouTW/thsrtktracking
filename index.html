<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高鐵里程定位</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#0F1A23;--ink:#F1F5F8;--mute:#93A5B3;--hsr:#FF8B4F;--ok:#4ADE80;--bad:#FF6B6B;--rule:#2A3B48;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
#mapwrap{flex:1;min-height:0;position:relative}
#map{position:absolute;inset:0}
#fab{position:absolute;left:10px;bottom:14px;z-index:1000;display:flex;flex-direction:column;gap:6px}
#fab button{flex:none;font-size:13px;padding:6px 10px;border-radius:8px;opacity:.92;min-width:64px}
#panel{background:var(--bg);border-top:1px solid var(--rule);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
#grid{display:grid;grid-template-columns:1fr 1.5fr;gap:6px 14px}
.lab{font-size:12px;color:var(--mute)}
.val{font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
#spd{font-size:54px}#spd small{font-size:16px;color:var(--mute);font-weight:600;margin-left:4px}
#mil{font-size:44px;color:var(--hsr);letter-spacing:-1px;white-space:nowrap}
#tm{font-size:26px}
#st{font-size:13px;color:var(--mute);margin-top:8px;display:flex;justify-content:space-between;gap:8px}
#st .bad{color:var(--bad)}#st .ok{color:var(--ok)}
.btns{display:flex;gap:8px;margin-top:10px}
button{flex:1;font:inherit;font-size:15px;color:var(--ink);background:#16242F;border:1px solid var(--rule);border-radius:10px;padding:11px}
#go{background:#1763E6;border-color:#1763E6;font-weight:700}
 #dpanel{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;width:208px;background:var(--bg);opacity:.94;border:1px solid var(--rule);border-radius:10px;padding:8px;font-size:13px}
#dpanel[hidden]{display:none}
#dpanel .drow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
#dpanel button{flex:1;font-size:14px;padding:6px 8px;border-radius:8px}
#dpanel button[aria-pressed="true"]{background:#1763E6;border-color:#1763E6}
#dv{flex:2;text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
#dh{color:var(--mute);line-height:1.4;margin-bottom:6px}
.leaflet-tooltip.k{background:transparent;border:0;box-shadow:none;color:#fff;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000}
.leaflet-tooltip.k:before{display:none}
</style>
</head>
<body>
<div id="app">
<div id="mapwrap"><div id="map"></div>
<div id="fab"><button id="go">定位</button><button id="fol">跟隨：開</button><button id="demo">模擬</button></div>
<div id="dpanel" hidden>
<div class="drow"><button id="dN">往北</button><button id="dS">往南</button></div>
<div class="drow"><button id="dm">−</button><span id="dv">120 km/h</span><button id="dp">＋</button></div>
<div id="dh"></div>
<button id="dx" style="width:100%">結束模擬</button>
</div></div>
<div id="panel">
<div id="grid">
<div><div class="lab">時速</div><div class="val" id="spd">--<small>km/h</small></div></div>
<div><div class="lab">現在里程</div><div class="val" id="mil">--</div></div>
<div style="grid-column:1/3"><div class="lab" id="tlab">UTC 時間</div><div class="val" id="tm">--:--:--</div></div>
</div>
<div id="st"><span id="s1">尚未開始</span><span id="s2"></span></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(async()=>{try{const D=await(await fetch('hsr-data.json')).json();
const n=D.length/3,CH=new Float64Array(n),LA=new Float64Array(n),LO=new Float64Array(n),X=new Float64Array(n),Y=new Float64Array(n);
const LAT0=24,KX=111320*Math.cos(LAT0*Math.PI/180),KY=110574;
const proj=(la,lo)=>[(lo-120.9)*KX,(la-LAT0)*KY];
for(let i=0;i<n;i++){CH[i]=D[3*i];LA[i]=D[3*i+1];LO[i]=D[3*i+2];[X[i],Y[i]]=proj(LA[i],LO[i])}
const $=id=>document.getElementById(id);
const fmt=ch=>{const a=Math.abs(Math.round(ch));return(ch<0?'−':'')+'K'+Math.floor(a/1000)+'+'+String(a%1000).padStart(3,'0')};

const nlsc=L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP5_OPENDATA/default/GoogleMapsCompatible/{z}/{y}/{x}',{maxZoom:19,attribution:'© 內政部國土測繪中心'});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});
const map=L.map('map',{layers:[nlsc],zoomControl:false}).setView([24.1,120.9],8);
L.control.layers({'國土測繪中心 電子地圖':nlsc,'OpenStreetMap':osm},null,{position:'topright'}).addTo(map);
L.control.zoom({position:'topleft'}).addTo(map);
let tileErr=0;nlsc.on('tileerror',()=>{if(++tileErr===6&&map.hasLayer(nlsc)){map.removeLayer(nlsc);osm.addTo(map)}});
const pts=[];for(let i=0;i<n;i++)pts.push([LA[i],LO[i]]);
const line=L.polyline(pts,{color:'#E4661F',weight:4,opacity:.9}).addTo(map);
const lab=L.layerGroup().addTo(map);let labT=0;
function llAt(ch){const i=seg(ch),f=Math.min(1,Math.max(0,(ch-CH[i])/(CH[i+1]-CH[i])));return[LA[i]+(LA[i+1]-LA[i])*f,LO[i]+(LO[i+1]-LO[i])*f]}
function buildLabels(){lab.clearLayers();const mpp=143000/Math.pow(2,map.getZoom()),step=[500,1000,2000,5000,10000,20000,50000].find(s=>s/mpp>=50)||50000,b=map.getBounds().pad(.2);
 for(let ch=Math.ceil(CH[0]/step)*step;ch<=CH[n-1];ch+=step){const p=llAt(ch);if(!b.contains(p))continue;
  const km=Math.floor(Math.abs(ch)/1000),m=Math.abs(ch)%1000,tx=(ch<0?'−':'')+'K'+km+(m?'+'+String(m).padStart(3,'0'):'');
  L.circleMarker(p,{radius:3,color:'#fff',weight:1,fillColor:'#E4661F',fillOpacity:1}).bindTooltip(tx,{permanent:true,direction:'right',className:'k',offset:[6,0]}).addTo(lab)}}
function sched(){if(!labT)labT=setTimeout(()=>{labT=0;buildLabels()},500)}
map.on('moveend zoomend',sched);
map.fitBounds(line.getBounds());buildLabels();
const me=L.circleMarker([0,0],{radius:8,color:'#fff',weight:3,fillColor:'#1763E6',fillOpacity:1});
const acc=L.circle([0,0],{radius:1,color:'#1763E6',weight:1,fillOpacity:.12});
const snap=L.circleMarker([0,0],{radius:6,color:'#fff',weight:2,fillColor:'#E4661F',fillOpacity:1});

let lastIdx=-1,prev=null,sp=null,lastRecv=0,follow=true,wl=null,first=true,watchId=null;
function nearest(px,py){
 let lo=0,hi=n-2;if(lastIdx>=0){lo=Math.max(0,lastIdx-80);hi=Math.min(n-2,lastIdx+80)}
 let best=null;
 for(let pass=0;pass<2;pass++){
  for(let i=lo;i<=hi;i++){const ax=X[i],ay=Y[i],bx=X[i+1]-ax,by=Y[i+1]-ay,l2=bx*bx+by*by;let t=l2?((px-ax)*bx+(py-ay)*by)/l2:0;t=t<0?0:t>1?1:t;
   const qx=ax+bx*t,qy=ay+by*t,d=Math.hypot(px-qx,py-qy);if(!best||d<best.d)best={d,i,t,ch:CH[i]+t*(CH[i+1]-CH[i]),la:LA[i]+t*(LA[i+1]-LA[i]),lo:LO[i]+t*(LO[i+1]-LO[i])}}
  if(pass===0&&best.d>1500&&(lo>0||hi<n-2)){lo=0;hi=n-2;best=null}else break}
 return best}
const tick=()=>{$('tm').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false,timeZone:'UTC'})};tick();setInterval(tick,1000);
const sm={base:null,t0:0,rate:0,corr:0,lastCh:null,lastTs:0};
function disp(now){const dt=(now-sm.t0)/1000;return sm.base+sm.rate*Math.min(dt,2)+sm.corr*Math.exp(-dt/.6)}
function fix(ch,ts){const now=performance.now();
 if(sm.lastCh!=null&&Math.abs(ch-sm.lastCh)>3000){sm.base=null;sm.rate=0;sm.lastCh=null}
 const shown=sm.base==null?ch:disp(now);
 if(sm.lastCh!=null&&ts>sm.lastTs){const r=(ch-sm.lastCh)/((ts-sm.lastTs)/1000);if(Math.abs(r)<150)sm.rate=sm.rate*.5+r*.5}
 sm.corr=shown-ch;sm.base=ch;sm.t0=now;sm.lastCh=ch;sm.lastTs=ts}
const ps={base:false,bx:0,by:0,t0:0,vx:0,vy:0,cx:0,cy:0,lx:0,ly:0,lts:0};
function pdisp(now){const dt=(now-ps.t0)/1000,k=Math.exp(-dt/.6),d=Math.min(dt,2);return[ps.bx+ps.vx*d+ps.cx*k,ps.by+ps.vy*d+ps.cy*k]}
function posFix(x,y,ts){const now=performance.now();
 if(ps.base&&Math.hypot(x-ps.lx,y-ps.ly)>3000)ps.base=false;
 let sx=x,sy=y;
 if(ps.base){[sx,sy]=pdisp(now);const dt=(ts-ps.lts)/1000;if(dt>0){const vx=(x-ps.lx)/dt,vy=(y-ps.ly)/dt;if(Math.hypot(vx,vy)<150){ps.vx=ps.vx*.5+vx*.5;ps.vy=ps.vy*.5+vy*.5}}}else{ps.vx=0;ps.vy=0}
 ps.cx=sx-x;ps.cy=sy-y;ps.bx=x;ps.by=y;ps.base=true;ps.t0=now;ps.lx=x;ps.ly=y;ps.lts=ts}
let lastTxt='';(function loop(){const now=performance.now();
 if(sm.base!=null){const s=fmt(disp(now));if(s!==lastTxt){lastTxt=s;$('mil').textContent=s}}
 if(ps.base&&!first){const[px,py]=pdisp(now),ll=[py/KY+LAT0,px/KX+120.9];me.setLatLng(ll);acc.setLatLng(ll);if(sm.base!=null)snap.setLatLng(llAt(disp(now)));if(follow)map.panTo(ll,{animate:false})}
 requestAnimationFrame(loop)})();
const SPEEDS=[5,30,45,70,120,170,230,300,315];
const demo={on:false,run:false,ch:0,dir:1,si:4,timer:null};
function simReset(ch){demo.ch=ch;prev=null;sp=null;lastIdx=-1;sm.base=null;sm.rate=0;sm.lastCh=null;ps.base=false;ps.vx=0;ps.vy=0}
function simEmit(v){const i=seg(demo.ch),f=Math.min(1,Math.max(0,(demo.ch-CH[i])/(CH[i+1]-CH[i])));
 update(LA[i]+(LA[i+1]-LA[i])*f,LO[i]+(LO[i+1]-LO[i])*f,5,v,Date.now())}
function simTick(){const v=SPEEDS[demo.si]/3.6;demo.ch+=demo.dir*v;
 if(demo.ch>=CH[n-1]||demo.ch<=CH[0]){demo.ch=Math.min(CH[n-1],Math.max(CH[0],demo.ch));simEmit(0);setRun(false);return}
 simEmit(v)}
function setRun(on){if(on===demo.run)return;demo.run=on;
 if(on){simTick();if(demo.run)demo.timer=setInterval(simTick,1000)}else{clearInterval(demo.timer);sm.rate=0;ps.vx=0;ps.vy=0}
 setDemoBtn()}
function setDemoBtn(){$('demo').textContent=!demo.on?'模擬':demo.run?'暫停模擬':'開始模擬'}
function setPanel(){$('dpanel').hidden=!demo.on;$('dN').setAttribute('aria-pressed',demo.dir<0);$('dS').setAttribute('aria-pressed',demo.dir>0);
 $('dv').textContent=SPEEDS[demo.si]+' km/h';$('dh').textContent=(demo.dir<0?'往北：里程數減少':'往南：里程數增加')+'。點地圖上的中心線，可從該點開始模擬。'}
function enterDemo(){if(demo.on)return;const c=sm.lastCh!=null?sm.lastCh:100000;demo.on=true;simReset(c);simEmit(0);setDemoBtn();setPanel()}
function toggleDemo(){if(!demo.on)enterDemo();else setRun(!demo.run)}
function stopDemo(){if(demo.run)setRun(false);demo.on=false;setDemoBtn();setPanel()}
function update(la,lo,accu,speed,ts){
 lastRecv=Date.now();const [x,y]=proj(la,lo),q=nearest(x,y);lastIdx=q.i;
 let v=speed;
 if(v==null||isNaN(v)){if(prev&&ts>prev.ts){const d=Math.hypot(x-prev.x,y-prev.y)/((ts-prev.ts)/1000);sp=sp==null?d:sp*.5+d*.5;v=sp}else v=null}
 prev={x,y,ts};
 $('spd').innerHTML=(v==null?'--':Math.round(v*3.6))+'<small>km/h</small>';
 fix(q.ch,ts);posFix(x,y,ts);
 const ll=[la,lo];me.setLatLng(ll);acc.setLatLng(ll).setRadius(accu||1);snap.setLatLng([q.la,q.lo]);
 if(!map.hasLayer(me)){acc.addTo(map);snap.addTo(map);me.addTo(map)}
 if(first){map.setView(ll,16);first=false}
 $('s2').textContent='距中心線 '+(q.d<1000?Math.round(q.d)+' m':(q.d/1000).toFixed(1)+' km')+'　誤差 ±'+Math.round(accu||0)+' m'}
function start(){
 $('go').textContent='定位中';
 stopDemo();
 if(!navigator.geolocation){$('s1').textContent='此瀏覽器不支援定位';return}
 if(watchId!=null)navigator.geolocation.clearWatch(watchId);
 watchId=navigator.geolocation.watchPosition(p=>{if(!demo.on)update(p.coords.latitude,p.coords.longitude,p.coords.accuracy,p.coords.speed,p.timestamp)},
  e=>{$('s1').innerHTML='<span class="bad">'+(e.code===1?'定位權限被拒絕，請在瀏覽器設定允許位置':'無法取得位置')+'</span>'},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
 getWL()}
function seg(ch){let lo=0,hi=n-2;while(lo<hi){const m=(lo+hi+1)>>1;if(CH[m]<=ch)lo=m;else hi=m-1}return lo}
async function getWL(){try{if('wakeLock' in navigator)wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&lastRecv)getWL()});
setInterval(()=>{if(!lastRecv)return;const s=Math.round((Date.now()-lastRecv)/1000);
 $('s1').innerHTML=demo.on?'<span class="ok">模擬模式'+(demo.run?'':'（已暫停）')+'</span>':s>5?'<span class="bad">GPS 訊號中斷 '+s+' 秒</span>':'<span class="ok">GPS 正常</span>'},1000);
map.on('dragstart',()=>{follow=false;$('fol').textContent='跟隨：關'});
$('fol').onclick=()=>{follow=!follow;$('fol').textContent='跟隨：'+(follow?'開':'關');if(follow&&me.getLatLng().lat)map.panTo(me.getLatLng())};
$('go').onclick=start;$('demo').onclick=toggleDemo;$('dx').onclick=stopDemo;
$('dN').onclick=()=>{demo.dir=-1;setPanel()};$('dS').onclick=()=>{demo.dir=1;setPanel()};
$('dm').onclick=()=>{if(demo.si>0)demo.si--;setPanel()};$('dp').onclick=()=>{if(demo.si<SPEEDS.length-1)demo.si++;setPanel()};
map.on('click',e=>{if(!demo.on)return;lastIdx=-1;const[x,y]=proj(e.latlng.lat,e.latlng.lng),q=nearest(x,y);simReset(q.ch);simEmit(demo.run?SPEEDS[demo.si]/3.6:0)});
if(location.search.includes('demo')){enterDemo();setRun(true)}
}catch(e){document.getElementById('s1').textContent='載入里程資料失敗，請確認 hsr-data.json 已和 index.html 一起上傳'}})();
</script>
</body>
</html>
