<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高鐵里程定位</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<div id="mapwrap"><div id="map"></div>
<div id="fab">
<button id="go"></button><button id="fol"></button><button id="carb"></button>
<button id="gmap" data-i="gmap"></button><button id="demo"></button><button id="lang" data-i="langbtn"></button>
</div>
<div id="dpanel" class="pop" hidden>
<div class="drow"><button id="dN" data-i="dN"></button><button id="dS" data-i="dS"></button></div>
<div class="drow"><button id="dm">−</button><span id="dv"></span><button id="dp">＋</button></div>
<div id="dh" class="note"></div>
<div class="drow"><button id="dr"></button><button id="dx" data-i="dx"></button></div>
</div>
<div id="cpanel" class="pop" hidden>
<div class="lab2" data-i="car_model"></div>
<div class="drow"><button id="m700">700T</button><button id="mN7">N700ST</button></div>
<div class="lab2" data-i="car_ends"></div>
<div class="drow"><button id="c1"></button><button id="c12"></button></div>
<div class="lab2" data-i="car_mid"></div>
<div class="cgrid"><button id="c2">2</button><button id="c3">3</button><button id="c4">4</button><button id="c5">5</button><button id="c6">6</button><button id="c7">7</button><button id="c8">8</button><button id="c9">9</button><button id="c10">10</button><button id="c11">11</button></div>
<div id="ci" class="note"></div>
<div class="drow"><button id="coff" data-i="coff"></button><button id="cx" data-i="cx"></button></div>
</div>
</div>
<div id="panel">
<div id="grid">
<div><div class="lab" data-i="spd"></div><div class="val" id="spd">--<small>km/h</small></div></div>
<div><div class="lab" id="mlab" data-i="mlab"></div><div class="val" id="mil">--</div></div>
<div style="grid-column:1/3"><div class="lab" id="tlab"></div><div class="val" id="tm">--:--:--</div></div>
</div>
<div id="st"><span id="s1"></span><span id="s2"></span></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="i18n.js"></script>
<script src="geo.js"></script>
<script src="smooth.js"></script>
<script src="comp.js"></script>
<script src="map.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
