<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高鐵里程定位</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#0F1A23;--ink:#F1F5F8;--mute:#93A5B3;--hsr:#FF8B4F;--ok:#4ADE80;--bad:#FF6B6B;--rule:#2A3B48;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
#mapwrap{flex:1;min-height:0;position:relative}
#map{position:absolute;inset:0}
#fab{position:absolute;left:10px;bottom:14px;z-index:1000;display:flex;flex-direction:column;gap:6px}
#fab button{flex:none;font-size:13px;padding:6px 10px;border-radius:8px;opacity:.92;min-width:64px}
#panel{background:var(--bg);border-top:1px solid var(--rule);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
#grid{display:grid;grid-template-columns:1fr 1.5fr;gap:6px 14px}
.lab{font-size:12px;color:var(--mute)}
.val{font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
#spd{font-size:54px}#spd small{font-size:16px;color:var(--mute);font-weight:600;margin-left:4px}
#mil{font-size:44px;color:var(--hsr);letter-spacing:-1px;white-space:nowrap}
#tm{font-size:26px}
#st{font-size:13px;color:var(--mute);margin-top:8px;display:flex;justify-content:space-between;gap:8px}
#st .bad{color:var(--bad)}#st .ok{color:var(--ok)}
.btns{display:flex;gap:8px;margin-top:10px}
button{flex:1;font:inherit;font-size:15px;color:var(--ink);background:#16242F;border:1px solid var(--rule);border-radius:10px;padding:11px}
#go{background:#1763E6;border-color:#1763E6;font-weight:700}
.leaflet-tooltip.k{background:transparent;border:0;box-shadow:none;color:#fff;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000}
.leaflet-tooltip.k:before{display:none}
</style>
</head>
<body>
<div id="app">
<div id="mapwrap"><div id="map"></div>
<div id="fab"><button id="go">定位</button><button id="fol">跟隨：開</button></div></div>
<div id="panel">
<div id="grid">
<div><div class="lab">時速</div><div class="val" id="spd">--<small>km/h</small></div></div>
<div><div class="lab">現在里程</div><div class="val" id="mil">--</div></div>
<div style="grid-column:1/3"><div class="lab" id="tlab">UTC 時間</div><div class="val" id="tm">--:--:--</div></div>
</div>
<div id="st"><span id="s1">尚未開始</span><span id="s2"></span></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(async()=>{try{const D=await(await fetch('hsr-data.json')).json();
const n=D.length/3,CH=new Float64Array(n),LA=new Float64Array(n),LO=new Float64Array(n),X=new Float64Array(n),Y=new Float64Array(n);
const LAT0=24,KX=111320*Math.cos(LAT0*Math.PI/180),KY=110574;
const proj=(la,lo)=>[(lo-120.9)*KX,(la-LAT0)*KY];
for(let i=0;i<n;i++){CH[i]=D[3*i];LA[i]=D[3*i+1];LO[i]=D[3*i+2];[X[i],Y[i]]=proj(LA[i],LO[i])}
const $=id=>document.getElementById(id);
const fmt=ch=>{const a=Math.abs(Math.round(ch/10)*10);return(ch<0?'−':'')+'K'+Math.floor(a/1000)+'+'+String(a%1000).padStart(3,'0')};

const nlsc=L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP5_OPENDATA/default/GoogleMapsCompatible/{z}/{y}/{x}',{maxZoom:19,attribution:'© 內政部國土測繪中心'});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});
const map=L.map('map',{layers:[nlsc],zoomControl:false}).setView([24.1,120.9],8);
L.control.layers({'國土測繪中心 電子地圖':nlsc,'OpenStreetMap':osm},null,{position:'topright'}).addTo(map);
L.control.zoom({position:'topleft'}).addTo(map);
let tileErr=0;nlsc.on('tileerror',()=>{if(++tileErr===6&&map.hasLayer(nlsc)){map.removeLayer(nlsc);osm.addTo(map)}});
const pts=[];for(let i=0;i<n;i++)pts.push([LA[i],LO[i]]);
const line=L.polyline(pts,{color:'#E4661F',weight:4,opacity:.9}).addTo(map);
for(let i=0;i<n;i++)if(CH[i]%10000===0)L.circleMarker(pts[i],{radius:3,color:'#fff',weight:1,fillColor:'#E4661F',fillOpacity:1}).bindTooltip('K'+CH[i]/1000,{permanent:true,direction:'right',className:'k',offset:[6,0]}).addTo(map);
map.fitBounds(line.getBounds());
const me=L.circleMarker([0,0],{radius:8,color:'#fff',weight:3,fillColor:'#1763E6',fillOpacity:1});
const acc=L.circle([0,0],{radius:1,color:'#1763E6',weight:1,fillOpacity:.12});
const snap=L.circleMarker([0,0],{radius:6,color:'#fff',weight:2,fillColor:'#E4661F',fillOpacity:1});

let lastIdx=-1,prev=null,sp=null,lastRecv=0,follow=true,wl=null,first=true;
function nearest(px,py){
 let lo=0,hi=n-2;if(lastIdx>=0){lo=Math.max(0,lastIdx-80);hi=Math.min(n-2,lastIdx+80)}
 let best=null;
 for(let pass=0;pass<2;pass++){
  for(let i=lo;i<=hi;i++){const ax=X[i],ay=Y[i],bx=X[i+1]-ax,by=Y[i+1]-ay,l2=bx*bx+by*by;let t=l2?((px-ax)*bx+(py-ay)*by)/l2:0;t=t<0?0:t>1?1:t;
   const qx=ax+bx*t,qy=ay+by*t,d=Math.hypot(px-qx,py-qy);if(!best||d<best.d)best={d,i,t,ch:CH[i]+t*(CH[i+1]-CH[i]),la:LA[i]+t*(LA[i+1]-LA[i]),lo:LO[i]+t*(LO[i+1]-LO[i])}}
  if(pass===0&&best.d>1500&&(lo>0||hi<n-2)){lo=0;hi=n-2;best=null}else break}
 return best}
const tick=()=>{$('tm').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false,timeZone:'UTC'})};tick();setInterval(tick,1000);
function update(la,lo,accu,speed,ts){
 lastRecv=Date.now();const [x,y]=proj(la,lo),q=nearest(x,y);lastIdx=q.i;
 let v=speed;
 if(v==null||isNaN(v)){if(prev&&ts>prev.ts){const d=Math.hypot(x-prev.x,y-prev.y)/((ts-prev.ts)/1000);sp=sp==null?d:sp*.5+d*.5;v=sp}else v=null}
 prev={x,y,ts};
 $('spd').innerHTML=(v==null?'--':Math.round(v*3.6))+'<small>km/h</small>';
 $('mil').textContent=fmt(q.ch);
 const ll=[la,lo];me.setLatLng(ll);acc.setLatLng(ll).setRadius(accu||1);snap.setLatLng([q.la,q.lo]);
 if(!map.hasLayer(me)){acc.addTo(map);snap.addTo(map);me.addTo(map)}
 if(first){map.setView(ll,16);first=false}else if(follow)map.panTo(ll,{animate:false});
 $('s2').textContent='距中心線 '+(q.d<1000?Math.round(q.d)+' m':(q.d/1000).toFixed(1)+' km')+'　誤差 ±'+Math.round(accu||0)+' m'}
function start(){
 $('go').textContent='定位中';
 if(location.search.includes('demo')){let ch=100000;setInterval(()=>{ch+=83.3;const i=seg(ch),t=(ch-CH[i])/(CH[i+1]-CH[i]);update(LA[i]+(LA[i+1]-LA[i])*t,LO[i]+(LO[i+1]-LO[i])*t,5,83.3,Date.now())},1000);return}
 if(!navigator.geolocation){$('s1').textContent='此瀏覽器不支援定位';return}
 navigator.geolocation.watchPosition(p=>update(p.coords.latitude,p.coords.longitude,p.coords.accuracy,p.coords.speed,p.timestamp),
  e=>{$('s1').innerHTML='<span class="bad">'+(e.code===1?'定位權限被拒絕，請在瀏覽器設定允許位置':'無法取得位置')+'</span>'},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
 getWL()}
function seg(ch){let lo=0,hi=n-2;while(lo<hi){const m=(lo+hi+1)>>1;if(CH[m]<=ch)lo=m;else hi=m-1}return lo}
async function getWL(){try{if('wakeLock' in navigator)wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&lastRecv)getWL()});
setInterval(()=>{if(!lastRecv)return;const s=Math.round((Date.now()-lastRecv)/1000);
 $('s1').innerHTML=s>5?'<span class="bad">GPS 訊號中斷 '+s+' 秒</span>':'<span class="ok">GPS 正常</span>'},1000);
map.on('dragstart',()=>{follow=false;$('fol').textContent='跟隨：關'});
$('fol').onclick=()=>{follow=!follow;$('fol').textContent='跟隨：'+(follow?'開':'關');if(follow&&me.getLatLng().lat)map.panTo(me.getLatLng())};
$('go').onclick=start;
}catch(e){document.getElementById('s1').textContent='載入里程資料失敗，請確認 hsr-data.json 已和 index.html 一起上傳'}})();
</script>
</body>
</html>
